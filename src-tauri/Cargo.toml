[package]
name = "answergate"
version = "0.1.0"
description = "AnswerGate 答题门禁控制台"
authors = ["AnswerGate Team"]
edition = "2021"
rust-version = "1.77"

# Tauri 2 桌面/移动共用 lib 入口（mobile 需要 cdylib/staticlib）
[lib]
name = "answergate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# 数据层：题库 JSON / config.toml / 抽题随机
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"

# 日志与时间
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }

# 错误统一（AppError → {code, message, data}）
thiserror = "1"

# 家长密码 hash（P1-01，默认关闭）
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
